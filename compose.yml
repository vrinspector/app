services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    # Increment 18: PowerSync reads changes through logical replication.
    # Harmless for everything else (the API and tests do not notice).
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Variable not set}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      # Increment 13.5 outbound email (AWS SES SMTP in production; values are
      # owner-supplied at RG-3, never committed).
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-}
      EMAILS_REPLY_TO: ${EMAILS_REPLY_TO:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Increment 15 AI capture (Claude API). Empty = AI buttons hidden. The key
      # is owner-supplied at RG-3, never committed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      S3_BUCKET: ${S3_BUCKET:-vrinspector-files}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID:-}
        - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE:-}
        - VITE_POWERSYNC_URL=${VITE_POWERSYNC_URL:-}
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  # Increment 18: offline sync. Off by default; start it with
  #   docker compose --profile offline up -d
  # Local development only: the staging / production service is set up by the
  # owner at RG-3 (REBUILD_PLAN.md rules 5 and 9). Config: powersync/.
  powersync-storage-init:
    image: postgres:18
    profiles: ["offline"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
    # Bucket storage lives in its own database, never in the app database.
    entrypoint:
      - sh
      - -c
      - >-
        psql -h db -U postgres -d app -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'powersync_storage'" | grep -q 1
        || psql -h db -U postgres -d app -c "CREATE DATABASE powersync_storage"
    restart: "no"

  powersync:
    image: journeyapps/powersync-service:1.27.2
    profiles: ["offline"]
    command: ["start", "-r", "unified"]
    depends_on:
      db:
        condition: service_healthy
      powersync-storage-init:
        condition: service_completed_successfully
    # The publication PowerSync reads is created by the API's migrations
    # (`alembic upgrade head`, see development.md); until it exists the
    # service logs the error and retries.
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      PS_DATA_SOURCE_SSLMODE: disable
      PS_STORAGE_URI: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/powersync_storage
      PS_STORAGE_SSLMODE: disable
      PS_PORT: "8080"
      PS_AUTH0_JWKS_URI: https://${AUTH0_DOMAIN:?Variable not set}/.well-known/jwks.json
      PS_AUTH0_AUDIENCE: ${AUTH0_API_AUDIENCE:?Variable not set}
    labels:
      - traefik.enable=true
      - traefik.http.services.powersync.loadbalancer.server.port=8080
      - traefik.http.routers.powersync-http.rule=Host(`sync.${DOMAIN:-localhost}`)
      - traefik.http.routers.powersync-http.entrypoints=http

volumes:
  app-db-data:
