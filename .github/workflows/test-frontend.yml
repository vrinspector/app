name: Test Frontend

# Type-check, component/unit tests (Vitest, jsdom), the offline sync config
# check and a production build of the frontend. End-to-end tests run separately in playwright.yml. This
# workflow builds and tests only; it never deploys (REBUILD_PLAN.md rule 9).

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun ci
        working-directory: frontend
      - name: Type-check (app and tests)
        run: bun run typecheck
        working-directory: frontend
      - name: Unit and component tests
        run: bun run test:unit
        working-directory: frontend
      - name: Offline sync config (PowerSync sync rules and service schema)
        run: bun run validate:sync
        working-directory: frontend
      - name: Production build
        run: bun run build
        working-directory: frontend
